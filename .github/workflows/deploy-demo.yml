name: Deploy Demo (Cloudflare Pages)
on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/**'
      - 'ui/tucu-docs/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build demo
        env:
          NX_NO_CLOUD: 'true'
          VITE_APP_URL: https://ui.estebanburgos.com.ar
          VITE_GOOGLE_ANALYTICS_TAG_ID: G-T33R2ME916

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/demo/dist --project-name=tucu-ui --branch=main
